<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#311042" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient circles -->
  <circle cx="150" cy="80" r="140" fill="#f59e0b" opacity="0.08" />
  <circle cx="1050" cy="240" r="160" fill="#ec4899" opacity="0.08" />
  <circle cx="900" cy="60" r="100" fill="#6366f1" opacity="0.1" />

  <!-- Decorative cutlery icon -->
  <g transform="translate(80, 75)" filter="url(#glow)">
    <circle cx="85" cy="85" r="75" fill="#f59e0b" opacity="0.2" />
    <circle cx="85" cy="85" r="60" fill="#f59e0b" opacity="0.3" />
    <!-- Fork -->
    <path d="M 65,55 L 65,85 C 65,95 75,100 75,110 L 75,125 C 75,128 78,130 81,130 C 84,130 87,128 87,125 L 87,110 C 87,100 97,95 97,85 L 97,55 M 75,55 L 75,80 M 87,55 L 87,80" 
          stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Spoon/Knife -->
    <path d="M 105,55 C 115,65 115,85 105,95 L 105,125 C 105,128 102,130 99,130 C 96,130 93,128 93,125 L 93,95" 
          stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="270" y="125" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
    THE ROYAL BISTRO
  </text>
  <text x="270" y="165" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#fcd34d" letter-spacing="1">
    PREMIUM DINE-IN • LIVE KITCHEN • POS BILLING SYSTEM
  </text>
  <text x="270" y="210" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#9ca3af">
    Fast table turns, instant discount calculations, and streamlined GST billing.
  </text>

  <!-- Decorative Badges -->
  <g transform="translate(930, 95)">
    <rect width="180" height="42" rx="21" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <circle cx="24" cy="21" r="6" fill="#10b981" />
    <text x="38" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#34d399">SYSTEM ACTIVE</text>
  </g>
</svg>
